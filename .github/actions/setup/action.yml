name: "Setup Flutter & JDK"
description: "Provision Temurin JDK 17 and the Flutter stable toolchain with caching."
runs:
  using: "composite"
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"
    - name: Set up Flutter (stable)
      uses: subosito/flutter-action@v2
      with:
        channel: "stable"
        cache: true
    - name: Print toolchain versions
      shell: bash
      run: |
        java -version
        flutter --version

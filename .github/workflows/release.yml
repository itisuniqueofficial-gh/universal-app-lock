name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match the VERSION file, e.g. 1.0.0)"
        required: true
        type: string

# Only what is needed to publish a production release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign & publish production release
    runs-on: ubuntu-latest
    environment: production
    env:
      CHANNEL: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve & validate version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file_version="$(tr -d ' \t\n\r' < VERSION)"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            input_version="${tag#v}"
          else
            input_version="${{ inputs.version }}"
            tag="v${input_version}"
          fi
          if [[ "$input_version" != "$file_version" ]]; then
            echo "::error::Requested version ($input_version) does not match VERSION file ($file_version)."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for $tag already exists. Refusing to overwrite."
            exit 1
          fi
          bash scripts/version/compute_version.sh VERSION

      - uses: ./.github/actions/setup

      - run: flutter pub get

      - name: Repository validation
        run: |
          bash scripts/validation/check_app_id.sh
          bash scripts/validation/check_permissions.sh
          bash scripts/validation/check_branding.sh
          bash scripts/validation/check_no_binaries.sh

      - name: Format, analyze & test
        run: |
          dart format lib test
          if ! git diff --quiet -- '*.dart'; then
            echo "::error::Dart code is not formatted."; git --no-pager diff -- '*.dart'; exit 1
          fi
          flutter analyze
          flutter test

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64. Configure production signing (docs/DEVELOPMENT.md). Failing safely."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore decoded"

      - name: Build signed APKs (universal + per-ABI) and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VN='${{ steps.ver.outputs.version_name }}'
          VC='${{ steps.ver.outputs.version_code }}'
          flutter build apk --release --build-name="$VN" --build-number="$VC"
          flutter build apk --release --split-per-abi --build-name="$VN" --build-number="$VC"
          flutter build appbundle --release --build-name="$VN" --build-number="$VC"

      - name: Stage & name assets
        id: stage
        run: |
          set -euo pipefail
          base="Universal-App-Lock-v${{ steps.ver.outputs.version }}"
          mkdir -p dist
          apk=build/app/outputs/flutter-apk
          cp "$apk/app-release.apk" "dist/${base}-universal.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [[ -f "$apk/app-${abi}-release.apk" ]]; then
              cp "$apk/app-${abi}-release.apk" "dist/${base}-${abi}.apk"
            fi
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/${base}.aab"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Verify APK application ID
        run: bash scripts/validation/verify_apk.sh "dist/${{ steps.stage.outputs.base }}-universal.apk" com.itisuniqueofficial.ual

      - name: Verify production signatures (required)
        run: |
          set -euo pipefail
          for f in dist/*.apk dist/*.aab; do
            bash scripts/release/verify_signing.sh "$f"
          done

      - name: Generate build metadata
        env:
          OUT: dist/build-info.json
          BASE_VERSION: ${{ steps.ver.outputs.version }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          COMMIT: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW: ${{ github.workflow }}
          SIGNED: "true"
          BUILD_STATUS: success
        run: bash scripts/release/build_info.sh

      - name: Generate changelog & release notes
        run: |
          set -euo pipefail
          bash scripts/changelog/generate_changelog.sh --out dist/CHANGELOG.md
          bash scripts/release/make_release_notes.sh "${{ steps.ver.outputs.version }}" \
            --changelog dist/CHANGELOG.md \
            --out dist/RELEASE_NOTES.md

      - name: Generate checksums
        run: bash scripts/release/checksums.sh dist/SHA256SUMS.txt dist/*.apk dist/*.aab dist/build-info.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.release_tag }}
          name: ${{ steps.ver.outputs.release_name }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
            dist/CHANGELOG.md
            dist/build-info.json

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
